version: '3.8'

services:
  # ==========================================
  # 1. DATABASE SERVICE (MongoDB 7)
  # ==========================================
  mongodb:
    image: mongo:7-jammy
    container_name: web_ban_oto_db
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=Password123!
      - MONGO_INITDB_DATABASE=db_web_oto
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # 2. BACKEND API SERVICE (Node.js Express)
  # ==========================================
  backend:
    build: ./server
    container_name: web_ban_oto_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://admin:Password123!@mongodb:27017/db_web_oto?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app-network

  # ==========================================
  # 3. FRONTEND SERVICE (React 19 + Nginx)
  # ==========================================
  web:
    build: .
    container_name: web_ban_oto_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - app-network

# Lưu trữ dữ liệu Database bền vững
volumes:
  mongodb_data:

networks:
  app-network:
    driver: bridge
