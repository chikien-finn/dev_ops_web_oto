server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip nén dữ liệu giúp tải trang nhanh hơn
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml;

    # Sử dụng resolver động và biến để Nginx không bị crash lúc khởi động
    # Giúp chạy mượt mà cả trong Docker Compose lẫn khi deploy độc lập trên Render/Cloud
    resolver 127.0.0.11 8.8.8.8 1.1.1.1 valid=30s ipv6=off;

    location /api/ {
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # Xử lý React SPA Router: Nếu không tìm thấy file thật thì trả về index.html
        # Giải quyết triệt để lỗi 404 khi truy cập hoặc reload ở /cars, /admin, /profile...
        try_files $uri $uri/ /index.html;
    }

    # Cache các tài nguyên tĩnh để tăng tốc độ
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
