name: AutoPremium CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ==========================================
  # GIAI ĐOẠN 1: KIỂM THỬ TỰ ĐỘNG & LINTING (CI)
  # ==========================================
  quality-check:
    name: Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies (Root & Server)
        run: |
          npm ci
          cd server && npm ci && cd ..

      - name: Run Frontend Linting (Oxlint)
        run: npm run lint

      - name: Run Backend API Automated Tests
        run: npm test

      - name: Test Frontend Production Build
        run: npm run build

  # ==========================================
  # GIAI ĐOẠN 2: BUILD VÀ PUSH DOCKER IMAGES
  # ==========================================
  build-and-push:
    name: Build & Push Docker Images
    needs: quality-check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/web_ban_oto_frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/web_ban_oto_frontend:${{ github.sha }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/web_ban_oto_backend:latest
            ${{ secrets.DOCKER_USERNAME }}/web_ban_oto_backend:${{ github.sha }}

  # ==========================================
  # GIAI ĐOẠN 3: TỰ ĐỘNG TRIỂN KHAI LÊN AWS EC2 (CD)
  # ==========================================
  deploy:
    name: Deploy to AWS EC2 via SSH
    needs: quality-check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Remote AWS EC2 Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "🚀 Đang cập nhật mã nguồn trên máy chủ AWS EC2..."
            cd ~/dev_ops_web_oto
            git pull origin main
            echo "🐳 Đang khởi động lại Docker Compose với bản build mới nhất..."
            docker compose up -d --build --remove-orphans
            sleep 3
            echo "✅ Trạng thái các container đang chạy:"
            docker ps
