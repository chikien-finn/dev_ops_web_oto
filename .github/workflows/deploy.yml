name: Deploy to Production

# Tự động chạy khi push code lên nhánh main
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest # Chạy trên máy ảo Ubuntu

    steps:
      # 1. Tải mã nguồn về máy ảo
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Khởi tạo Docker Buildx để tối ưu build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Dùng cache để các lần build sau nhanh hơn
      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # 4. Đăng nhập Docker Hub bằng Secret
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Build image và đẩy (push) lên Docker Hub
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/web_ban_oto:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # 6. Cập nhật cache mới cho lần chạy tiếp theo
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache


