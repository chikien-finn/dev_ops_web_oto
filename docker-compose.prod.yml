services:
  mongodb:
    image: mongo:7-jammy
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD chua duoc dat trong .env}
      MONGO_INITDB_DATABASE: db_web_oto
    # Không publish 27017 ra internet: chỉ backend trong network nội bộ truy cập được DB
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [app-network]

  backend:
    image: ${DOCKERHUB_USER:?}/oto-api:${IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      PORT: "5000"
      NODE_ENV: production
      MONGO_URI: mongodb://${DB_USER:-admin}:${DB_PASSWORD}@mongodb:27017/db_web_oto?authSource=admin
    # Không publish 5000: chỉ Nginx (web) gọi vào qua network nội bộ
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [app-network]

  web:
    image: ${DOCKERHUB_USER:?}/oto-web:${IMAGE_TAG:?}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [app-network]

volumes:
  mongodb_data:

networks:
  app-network:
