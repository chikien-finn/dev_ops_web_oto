services:
  sqlserver:
    # TODO: ghim bản cụ thể (CU hoặc digest) thay vì -latest để deploy lặp lại được
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD chua duoc dat trong .env}
    # Không publish 1433: chỉ backend trong network nội bộ truy cập được DB
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      # $$ để compose không tự nội suy; biến được shell trong container đọc
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [app-network]

  backend:
    image: ${DOCKERHUB_USER:?}/oto-api:${IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      PORT: "5000"
      NODE_ENV: production
      DB_USER: sa
      DB_PASSWORD: ${DB_PASSWORD:?}
      DB_SERVER: sqlserver
      DB_DATABASE: db_web_oto
      DB_PORT: "1433"
    # Không publish 5000: chỉ Nginx (web) gọi vào qua network nội bộ
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks: [app-network]

  web:
    image: ${DOCKERHUB_USER:?}/oto-web:${IMAGE_TAG:?}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [app-network]

volumes:
  sqlserver_data:

networks:
  app-network:
